name: Decompile Legacy Source Jars

on:
  workflow_dispatch:
  push:
    paths:
      - '*.jar'
      - '.github/workflows/decompile.yml'

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JADX
        run: |
          set -euxo pipefail
          JADX_VERSION=1.5.0
          curl -L --fail --retry 3 \
            -o jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Decompile jars into separate folders
        run: |
          set -euxo pipefail
          mkdir -p decompiled reports

          for jar in ./*.jar; do
            [ -e "$jar" ] || continue
            base="$(basename "$jar" .jar)"
            out="decompiled/$base"
            mkdir -p "$out"

            echo "=== $jar ===" | tee "reports/$base.txt"
            unzip -l "$jar" | tee -a "reports/$base.txt"

            ./jadx/bin/jadx \
              --show-bad-code \
              --deobf \
              -d "$out" \
              "$jar" \
              >"reports/$base-jadx.log" 2>&1 || true

            echo "" >> "reports/$base.txt"
            echo "=== Decompiled source files ===" >> "reports/$base.txt"
            find "$out" -type f | sort >> "reports/$base.txt" || true
          done

      - name: Build summary
        run: |
          set -euxo pipefail
          {
            echo "# Legacy JAR decompile summary"
            echo
            for jar in ./*.jar; do
              [ -e "$jar" ] || continue
              base="$(basename "$jar" .jar)"
              echo "## $base"
              echo
              echo "- SHA-256: `$(sha256sum "$jar" | awk '{print $1}')`"
              echo "- Decompiled Java files: $(find "decompiled/$base" -name '*.java' | wc -l)"
              echo "- classes.dex present: $(unzip -l "$jar" | grep -c 'classes.dex' || true)"
              echo
            done
          } > reports/SUMMARY.md

      - name: Upload decompiled sources
        uses: actions/upload-artifact@v4
        with:
          name: legacy-jar-decompiled
          path: |
            decompiled/
            reports/
          retention-days: 30
