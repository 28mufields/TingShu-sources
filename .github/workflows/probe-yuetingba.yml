name: Probe YuetingBa Protocol

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-yuetingba.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Probe current YuetingBa protocol
        shell: bash
        run: |
          set -u
          mkdir -p reports pages
          REPORT="reports/yuetingba-probe.txt"
          : > "$REPORT"

          echo "YuetingBa protocol probe" | tee -a "$REPORT"
          echo "========================" | tee -a "$REPORT"
          echo "DNS:" | tee -a "$REPORT"
          getent ahostsv4 www.yuetingba.cn | head -5 | tee -a "$REPORT" || true

          fetch() {
            local url="$1"
            local out="$2"
            echo "FETCH $url" | tee -a "$REPORT"
            curl -4 --http1.1 -L --compressed               --connect-timeout 10 --max-time 30               --retry 2 --retry-delay 2               -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"               -e "https://www.yuetingba.cn/"               -w "HTTP=%{http_code} FINAL=%{url_effective} BYTES=%{size_download}\n"               -o "$out" "$url" 2>>"$REPORT" | tee -a "$REPORT"
            return ${PIPESTATUS[0]}
          }

          # Test both schemes so GitHub network restrictions are distinguishable from site changes.
          fetch "http://www.yuetingba.cn/book/1/1" pages/category-http.html || true
          fetch "https://www.yuetingba.cn/book/1/1" pages/category.html || true

          if [ ! -s pages/category.html ] && [ -s pages/category-http.html ]; then
            cp pages/category-http.html pages/category.html
          fi

          if [ ! -s pages/category.html ]; then
            echo "NETWORK_BLOCKED category_fetch_failed=true" | tee -a "$REPORT"
          else
            grep -q "section-box-list-item" pages/category.html               && echo "CATEGORY old-list-css=true" | tee -a "$REPORT"               || echo "CATEGORY old-list-css=false" | tee -a "$REPORT"
            grep -q "下一页" pages/category.html               && echo "CATEGORY has-next=true" | tee -a "$REPORT"               || echo "CATEGORY has-next=false" | tee -a "$REPORT"
          fi

          SEARCH_URL="https://www.yuetingba.cn/search?type=1&name=%E5%87%A1%E4%BA%BA&pageIndex=1"
          fetch "$SEARCH_URL" pages/search.html || true
          if [ -s pages/search.html ]; then
            grep -q "section-box-list-item" pages/search.html               && echo "SEARCH old-list-css=true" | tee -a "$REPORT"               || echo "SEARCH old-list-css=false" | tee -a "$REPORT"
            grep -q "凡人" pages/search.html               && echo "SEARCH has-keyword=true" | tee -a "$REPORT"               || echo "SEARCH has-keyword=false" | tee -a "$REPORT"
          else
            echo "SEARCH fetch_failed=true" | tee -a "$REPORT"
          fi

          SAMPLE="https://www.yuetingba.cn/book/detail/3a073e9a-7a41-3eab-e915-8316e1997373/0"
          fetch "$SAMPLE" pages/detail.html || true

          python3 - <<'PY' | tee -a "$REPORT"
          import base64, json, os, re, subprocess, urllib.parse

          detail_path = "pages/detail.html"
          if not os.path.exists(detail_path) or os.path.getsize(detail_path) == 0:
              print("DETAIL fetch_failed=true")
              print("RESULT network_limited=true")
              raise SystemExit(0)

          detail = open(detail_path, encoding="utf-8", errors="replace").read()
          print("DETAIL bytes=" + str(len(detail)))
          print("DETAIL old-playlist-css=" + str("ting-list-content" in detail).lower())

          m = re.search(r"var\s+assl\s*=\s*['\"]([^'\"]+)['\"]", detail)
          if not m:
              print("ASSL found=false")
              print("RESULT protocol_changed=true")
              raise SystemExit(0)

          assl = m.group(1)
          print("ASSL found=true length=" + str(len(assl)))

          def decrypt_b64(cipher_b64, key_bytes, iv_bytes):
              p = subprocess.run(
                  ["openssl", "enc", "-d", "-aes-128-cbc", "-a", "-A",
                   "-K", key_bytes.hex(), "-iv", iv_bytes.hex()],
                  input=cipher_b64.encode(), stdout=subprocess.PIPE, stderr=subprocess.PIPE
              )
              if p.returncode != 0:
                  raise RuntimeError(p.stderr.decode(errors="replace"))
              return p.stdout.decode("utf-8", errors="replace")

          try:
              plain = decrypt_b64(
                  assl,
                  base64.b64decode("le95G3hnFDJsBE+1/v9eYw=="),
                  base64.b64decode("IvswQFEUdKYf+d1wKpYLTg==")
              )
              arr = json.loads(plain)
              print("ASSL decrypt=true json-items=" + str(len(arr)))
              s = arr[1]
              print("MEDIA_SERVER host=" + str(s.get("Value","")) + " port=" + str(s.get("Port","")))
          except Exception as e:
              print("ASSL decrypt=false error=" + type(e).__name__)
              print("RESULT protocol_changed=true")
              raise SystemExit(0)

          ids = re.findall(r'id=["\']item_([^"\']+)["\']', detail)
          print("CHAPTER ids-found=" + str(len(ids)))
          if ids:
              open("pages/chapter-id.txt","w").write(ids[0])
          else:
              print("RESULT protocol_changed=true")
          PY

          if [ -s pages/chapter-id.txt ]; then
            CHAPTER_ID="$(cat pages/chapter-id.txt)"
            API_HTTPS="https://www.yuetingba.cn/api/app/docs-listen/$CHAPTER_ID/ting-with-efi"
            API_HTTP="http://www.yuetingba.cn/api/app/docs-listen/$CHAPTER_ID/ting-with-efi"
            fetch "$API_HTTPS" pages/play-api.json || true
            if [ ! -s pages/play-api.json ]; then
              fetch "$API_HTTP" pages/play-api.json || true
            fi

            python3 - <<'PY' | tee -a "$REPORT"
          import json, os
          p="pages/play-api.json"
          if not os.path.exists(p) or os.path.getsize(p)==0:
              print("PLAY_API fetch_failed=true")
          else:
              try:
                  o=json.load(open(p,encoding="utf-8"))
                  keys=("efi","id","creationTime")
                  print("PLAY_API json=true")
                  print("PLAY_API compatible=" + str(all(k in o for k in keys)).lower())
                  print("PLAY_API keys=" + ",".join(sorted(o.keys())))
              except Exception as e:
                  print("PLAY_API json=false error=" + type(e).__name__)
          PY
          fi

          echo "--- SUMMARY ---" | tee -a "$REPORT"
          cat "$REPORT"

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuetingba-probe
          path: |
            reports/
            pages/
          retention-days: 14
