name: Build TingShu Sources

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: source-repo

      - name: Checkout official CustomSources
        uses: actions/checkout@v4
        with:
          repository: eprendre/tingshu
          ref: master
          path: upstream

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          java-version: '18'
          distribution: 'zulu'

      - name: Install maintained source package
        run: |
          set -euxo pipefail
          rm -rf upstream/CustomSources/src/main/kotlin/com/github/eprendre/sources_by_28mufields
          mkdir -p upstream/CustomSources/src/main/kotlin/com/github/eprendre/sources_by_28mufields
          cp source-repo/src/com/github/eprendre/sources_by_28mufields/*.kt \
             upstream/CustomSources/src/main/kotlin/com/github/eprendre/sources_by_28mufields/
          sed -i 's/^MY_SOURCES_PACKAGE=.*/MY_SOURCES_PACKAGE=sources_by_28mufields/' upstream/CustomSources/gradle.properties

      - name: Build DEX jar
        run: |
          set -euxo pipefail
          chmod +x upstream/CustomSources/gradlew upstream/dx/d8
          cd upstream/CustomSources
          ./gradlew jar --no-daemon

      - name: Verify output
        run: |
          set -euxo pipefail
          JAR="upstream/CustomSources/build/libs/sources_by_28mufields.jar"
          test -f "$JAR"
          unzip -l "$JAR" | tee jar-contents.txt
          unzip -l "$JAR" | grep -q 'classes.dex'
          sha256sum "$JAR" | tee jar-sha256.txt
          cp "$JAR" source-repo/sources_by_28mufields.jar

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: sources_by_28mufields
          path: |
            source-repo/sources_by_28mufields.jar
            jar-contents.txt
            jar-sha256.txt
          retention-days: 30
