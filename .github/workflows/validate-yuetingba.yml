name: Validate YuetingBa End to End

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate-yuetingba.yml'
      - 'src/com/github/eprendre/sources_by_28mufields/YuetingBa.kt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate live protocol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY' | tee reports/yuetingba-e2e.txt
          import base64, hashlib, json, re, subprocess, time, urllib.parse, urllib.request

          BASE="http://www.yuetingba.cn"
          DETAIL=BASE+"/book/detail/3a073e9a-7a41-3eab-e915-8316e1997373/0"
          SK="xMiP5W1DHBxC5PwQ5oj5QfRn0tsT5UBk"
          KEY="le95G3hnFDJsBE+1/v9eYw=="
          IV="IvswQFEUdKYf+d1wKpYLTg=="
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"

          def fetch(url, headers=None, timeout=30):
              h={"User-Agent":UA,"Referer":BASE+"/"}
              if headers: h.update(headers)
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status,r.headers,r.read()

          def dec_b64(value,key_bytes,iv_bytes):
              p=subprocess.run(
                  ["openssl","enc","-d","-aes-128-cbc","-a","-A",
                   "-K",key_bytes.hex(),"-iv",iv_bytes.hex()],
                  input=value.encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE
              )
              if p.returncode != 0:
                  raise RuntimeError(p.stderr.decode(errors="replace"))
              return p.stdout.decode("utf-8",errors="strict")

          status,_,body=fetch(DETAIL)
          html=body.decode("utf-8",errors="replace")
          print("DETAIL status",status,"bytes",len(body))

          assl=re.search(r"var\s+assl\s*=\s*['\"]([^'\"]+)['\"]",html).group(1)
          py=re.search(r"var\s+py\s*=\s*['\"]([^'\"]+)['\"]",html).group(1)
          ids=re.findall(r'id=["\']item_([^"\']+)["\']',html)
          assert ids
          chapter=ids[0]
          book_id="3a073e9a-7a41-3eab-e915-8316e1997373"

          cleaned=assl.replace(SK,"")
          servers=json.loads(dec_b64(cleaned,base64.b64decode(KEY),base64.b64decode(IV)))
          ipv4=[x for x in servers if str(x.get("AsType"))=="1" and x.get("Type")=="A"]
          suffix=book_id.split("-")[-1]
          matched=[x for x in ipv4 if x.get("BookIds") and suffix in str(x.get("BookIds")).split(",")]
          candidates=matched or [x for x in ipv4 if not x.get("BookIds")] or ipv4
          server=max(candidates,key=lambda x:int(x.get("Ratio") or 0))
          server_url=f"{server.get('Scheme','http')}://{server['Value']}:{server['Port']}"
          print("ASSL decrypt=true servers",len(servers))
          print("SERVER name",server.get("Name"),"host",server["Value"],"port",server["Port"])

          api=BASE+f"/api/app/docs-listen/{chapter}/ting-with-efi"
          a_status,_,a_body=fetch(api)
          obj=json.loads(a_body)
          print("PLAY_API status",a_status,"keys",sorted(obj.keys()))
          assert all(k in obj for k in ("efi","id","creationTime"))

          e=str(obj["id"]).replace("-","")
          t=str(obj["creationTime"])
          for ch in ".-T :": t=t.replace(ch,"")
          t=t.ljust(20,"0")

          key="".join(chr(ord(e[i])+int(t[i])) for i in range(20))
          key+="".join(chr(ord(e[i])+int(t[i-20])) for i in range(20,len(e)))
          iv="".join(chr(ord(e[i])+int(t[i-1])) for i in range(20,4,-1))
          path=dec_b64(str(obj["efi"]),key.encode(),iv.encode())
          filename=path.split("?",1)[0].rsplit("/",1)[-1]

          name=str(server.get("Name") or "")
          if name.endswith("_p"):
              path=f"/{py}_{book_id}/{filename}"
          elif name.endswith("_b"):
              path=f"/myfiles/host/listen/booksdir/{py}_{book_id}/{filename}"

          expire=int(time.time())+600
          token=hashlib.md5(f"{filename}|{expire}|{SK}".encode()).hexdigest()
          media=server_url.rstrip("/")+"/"+path.lstrip("/")+f"?token={token}&expire={expire}"
          parsed=urllib.parse.urlparse(media)
          print("MEDIA generated=true scheme",parsed.scheme,"host",parsed.hostname,"port",parsed.port,"ext",parsed.path.rsplit(".",1)[-1] if "." in parsed.path else "")

          try:
              m_status,m_headers,m_body=fetch(media,{"Range":"bytes=0-0"},timeout=30)
              print("MEDIA_RANGE status",m_status,"content-type",m_headers.get("Content-Type",""),"bytes-read",len(m_body))
              assert m_status in (200,206)
              print("RESULT compatible=true")
          except Exception as e:
              print("MEDIA_RANGE error",type(e).__name__,str(e))
              raise
          PY

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuetingba-e2e
          path: reports/
          retention-days: 14
