name: Probe ITingShu SP Algorithm

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-itingshu-sp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Probe deterministic SP values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > probe.js <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const vals=[0,0.25,0.5,0.75,0.999999];
            let out=[];
            for(const v of vals){
              const c=await b.newContext({
                userAgent:'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36',
                viewport:{width:390,height:844}
              });
              await c.addInitScript(value=>{ Math.random=()=>value; },v);
              const p=await c.newPage();
              p.on('request',r=>{
                if(r.url().includes('/api/mapi/play')){
                  out.push({
                    random:v,
                    postData:r.postData(),
                    sc:r.headers()['sc']||'',
                    sp:r.headers()['sp']||'',
                    referer:r.headers()['referer']||''
                  });
                }
              });
              await p.goto('https://m.itingshu.net/play/9808_1_100347.html',{waitUntil:'domcontentloaded',timeout:60000}).catch(()=>{});
              await p.waitForTimeout(6000);
              const meta=await p.locator('meta').evaluateAll(es=>Object.fromEntries(es.filter(e=>e.name&&e.name.startsWith('_')).map(e=>[e.name,e.content])));
              out.push({random:v,meta});
              await c.close();
            }
            fs.writeFileSync('reports/sp-probe.json',JSON.stringify(out,null,2));
            console.log(JSON.stringify(out,null,2));
            await b.close();
          })();
          JS
          node probe.js

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: itingshu-sp-probe
          path: reports/
          retention-days: 14
